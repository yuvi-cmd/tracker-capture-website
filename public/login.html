<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080f">
<title>Guardian Panel — Login</title>
<style>
:root { --bg:#05080f; --txt:#eaf0fb; --muted:#92a2c1; --a1:#4f8cff; --a2:#22d3ee; --bad:#f87171; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px 18px; position:relative; overflow:hidden;
}
.blob { position:fixed; border-radius:50%; filter:blur(90px); opacity:.55; z-index:0; }
.b1 { width:340px;height:340px; background:#1d4ed8; top:-120px; left:-100px; animation:drift1 14s ease-in-out infinite alternate; }
.b2 { width:300px;height:300px; background:#0e7490; bottom:-110px; right:-90px; animation:drift2 17s ease-in-out infinite alternate; }
.b3 { width:230px;height:230px; background:#6d28d9; top:40%; right:-80px; opacity:.35; animation:drift1 20s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { from{transform:translate(0,0) scale(1)} to{transform:translate(60px,50px) scale(1.15)} }
@keyframes drift2 { from{transform:translate(0,0) scale(1.1)} to{transform:translate(-50px,-40px) scale(1)} }

.card {
  position:relative; z-index:1; width:100%; max-width:400px;
  background:linear-gradient(180deg,rgba(17,26,46,.93),rgba(9,14,30,.93));
  border:1px solid rgba(255,255,255,.09); border-radius:26px;
  padding:34px 28px 28px; backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
}
.card::before {
  content:""; position:absolute; top:-1px; left:15%; right:15%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(125,178,255,.7),transparent);
}
.chip {
  display:block; width:max-content; margin:0 auto 16px; padding:5px 14px; border-radius:999px;
  font-size:.64rem; letter-spacing:2.5px; text-transform:uppercase; font-weight:700;
  color:#8fd3ff; border:1px solid rgba(143,211,255,.28); background:rgba(143,211,255,.08);
}
.logo {
  width:72px; height:72px; border-radius:22px; margin:0 auto 16px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  display:flex; align-items:center; justify-content:center; font-size:2rem;
  box-shadow:0 12px 40px rgba(79,140,255,.45);
}
h1 { font-size:1.5rem; font-weight:800; text-align:center; letter-spacing:.2px; }
h1 span {
  background:linear-gradient(90deg,#8ab6ff,#67e8f9);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.sub { text-align:center; color:var(--muted); font-size:.82rem; margin:8px 0 24px; line-height:1.5; }

.field { position:relative; margin-bottom:13px; }
.field .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:.95rem; opacity:.75; pointer-events:none; }
.field input {
  width:100%; padding:13px 44px 13px 42px; border-radius:14px;
  border:1px solid rgba(255,255,255,.1); background:rgba(4,9,20,.65);
  color:var(--txt); font-size:.95rem; outline:none; transition:.2s;
}
.field input:focus { border-color:var(--a1); box-shadow:0 0 0 3px rgba(79,140,255,.18); background:rgba(4,9,20,.9); }
.field input::placeholder { color:#5d6f92; }
.eye {
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  background:none; border:none; font-size:1.05rem; cursor:pointer; padding:9px; color:var(--muted);
}
.go {
  width:100%; margin-top:8px; padding:14px; border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  color:#05121e; font-weight:800; font-size:1rem; letter-spacing:.3px; cursor:pointer;
  transition:.15s; box-shadow:0 12px 32px rgba(34,211,238,.25);
}
.go:active { transform:scale(.98); }
.go:disabled { opacity:.6; cursor:wait; }
.err {
  display:none; margin-top:14px; padding:11px 13px; border-radius:12px;
  background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.35);
  color:var(--bad); font-size:.82rem; text-align:center;
}
.err.show { display:block; animation:shake .35s; }
@keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.foot { margin-top:20px; text-align:center; font-size:.8rem; color:var(--muted); }
.foot a { color:#67e8f9; font-weight:600; text-decoration:none; }
.note { margin-top:12px; text-align:center; font-size:.68rem; color:#5d6f92; letter-spacing:.4px; }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="card">
  <div class="chip">Parental Control</div>
  <div class="logo">🛡️</div>
  <h1><span>Guardian Panel</span></h1>
  <p class="sub">Login karo apne account se —<br>sirf apne phones ka data dikhega</p>

  <form onsubmit="return doLogin()">
    <div class="field">
      <span class="ic">✉️</span>
      <input type="email" id="em" placeholder="Email daalo" autocomplete="email" autocapitalize="none">
    </div>
    <div class="field">
      <span class="ic">🔒</span>
      <input type="password" id="pw" placeholder="Password daalo" autocomplete="current-password">
      <button type="button" class="eye" onclick="togglePw()" id="eye">👁️</button>
    </div>
    <button type="submit" class="go" id="btn">🔓 Unlock Panel</button>
  </form>

  <div class="err" id="err">❌ Galat email ya password</div>

  <div class="foot">Naya account? <a href="/register">Register karo →</a></div>
  <div class="note">Child monitoring • Sirf authorized use</div>
</div>

<script>
function togglePw() {
  var p = document.getElementById("pw");
  var e = document.getElementById("eye");
  if (p.type === "password") { p.type = "text"; e.textContent = "🙈"; }
  else { p.type = "password"; e.textContent = "👁️"; }
}
function doLogin() {
  var em = document.getElementById("em").value.trim();
  var pw = document.getElementById("pw").value;
  var err = document.getElementById("err");
  var btn = document.getElementById("btn");
  if (!em || !pw) { err.classList.add("show"); return false; }
  err.classList.remove("show");
  btn.disabled = true; btn.textContent = "Checking...";
  fetch("/api/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email: em, password: pw })
  }).then(function (r) {
    if (r.ok) { window.location.href = "/"; return; }
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "🔓 Unlock Panel";
  }).catch(function () {
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "🔓 Unlock Panel";
  });
  return false;
}
</script>
</body>
</html>
