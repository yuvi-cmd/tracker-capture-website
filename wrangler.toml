# FRESH BUILD #4 (2026-11-17): module worker + ASSETS binding + naya admin login
# Purane failed build ka RETRY mat dabao — wo purana commit dobara chalata hai
name = "tracker-capture-website"
compatibility_date = "2024-01-01"
main = "worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

